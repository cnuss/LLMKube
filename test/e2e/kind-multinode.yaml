# A control plane and two workers that share one host directory, for the
# e2e specs that need more than one node (make test-e2e-multinode). One
# worker carries the label the docs' off-GPU placement rule keys on, so a
# spec can keep work off it or pin work to it; neither worker has a GPU.
# Today the prefetch spec (test/e2e/multinode_prefetch_e2e_test.go) uses it:
# a Job on the download worker fills a claim, and a pod on the GPU worker
# reads it.
#
# __SHARED_CACHE_DIR__ is replaced by make setup-test-e2e-multinode with
# E2E_SHARED_CACHE_DIR; the directory must exist on the host first.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      llmkube.dev/e2e-node: download
    extraMounts:
      - hostPath: __SHARED_CACHE_DIR__
        containerPath: /mnt/llmkube-shared-cache
  - role: worker
    labels:
      llmkube.dev/e2e-node: serving
      nvidia.com/gpu.present: "true"
    extraMounts:
      - hostPath: __SHARED_CACHE_DIR__
        containerPath: /mnt/llmkube-shared-cache

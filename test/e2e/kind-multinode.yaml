# A control plane and two workers that share one host directory, for the
# multi-node prefetch e2e (test/e2e/multinode_prefetch_e2e_test.go): the
# prefetch Job fills a claim from the download worker, and a serving pod
# pinned to the "GPU" worker reads it. The GPU worker carries the label the
# docs' off-GPU placement rule keys on; neither worker has a GPU.
#
# __SHARED_CACHE_DIR__ is replaced by make setup-test-e2e-multinode with
# E2E_SHARED_CACHE_DIR; the directory must exist on the host first.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      llmkube.dev/e2e-node: download
    extraMounts:
      - hostPath: __SHARED_CACHE_DIR__
        containerPath: /mnt/llmkube-shared-cache
  - role: worker
    labels:
      llmkube.dev/e2e-node: serving
      nvidia.com/gpu.present: "true"
    extraMounts:
      - hostPath: __SHARED_CACHE_DIR__
        containerPath: /mnt/llmkube-shared-cache
